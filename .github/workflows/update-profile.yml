name: Refresh profile

on:
  schedule:
    - cron: '23 1,7,13,19 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - README.md
      - profile-config.json
      - scripts/**
      - tests/**
      - .github/workflows/update-profile.yml
      - .github/workflows/check-profile.yml

permissions:
  contents: read

concurrency:
  group: profile-refresh
  cancel-in-progress: false

jobs:
  refresh:
    if: github.repository == 'jinchuntan/jinchuntan'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Check the updater
        run: |
          python3 -m unittest discover -s tests -v
          python3 scripts/update_profile.py --check
      - name: Refresh public contributions
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 scripts/update_profile.py
      - name: Validate refreshed profile
        run: python3 scripts/update_profile.py --check
      - name: Commit updated profile files
        run: |
          git add -A -- README.md data/contributions.json assets/
          if git diff --cached --quiet; then
            echo "Profile is already current."
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Refresh public contribution snapshot'
          git push
